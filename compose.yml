services:
  api:
    build:
      context: ./source
    environment:
      APP_LOG_FILE: /tmp/app-logs/app.log
      DATABASE_URL: sqlite:////data/addresses.db
    ports:
      - "8000:8000"
    volumes:
      - api_logs:/tmp/app-logs
      - api_data:/data
    restart: unless-stopped

  test:
    build:
      context: ./source
    environment:
      DATABASE_URL: sqlite:////tmp/test_addresses.db
    volumes:
      - ./source/tests:/app/tests
    command: python -m pytest tests/ -v -p no:cacheprovider
    profiles: ["test"]

volumes:
  api_logs:
  api_data:
